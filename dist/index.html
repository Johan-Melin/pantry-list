<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f0"><meta name="description" content="A little order for your everyday essentials. Track your pantry, fridge and everything in between."><title>Pantry — A little order at home</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./"><span class="brand-icon">▥</span> pantry<span class="brand-dot">.</span></a><span class="header-note">A LITTLE ORDER AT HOME</span></header><section class="intro"><div><p class="eyebrow">YOUR EVERYDAY ESSENTIALS</p><h1>Know what’s<br>in your kitchen.</h1><p class="subtitle">Less guessing. Fewer forgotten things.</p></div><div class="check-card"><span class="check-icon">✓</span><div><label for="checked-date">Last checked</label><input type="date" id="checked-date" aria-label="Last checked date"><span id="never">Not checked yet</span></div><button id="check-today" class="primary">Checked today <span>↗</span></button></div></section><nav class="toolbar" aria-label="Pantry controls"><div class="filters"><button class="filter active" data-filter="all">Everything <span id="all-count">0</span></button><button class="filter" data-filter="buy">To buy <span id="buy-count">0</span></button></div><button class="quiet" id="organize">⇅ <span>Rearrange</span></button></nav><p class="organize-help" hidden>Use the arrows to reorder. Select a category to move an item between shelves.</p><div id="categories"></div><button id="add-category" class="add-category">＋ Add a category</button><footer><span>A place for everything.</span><span>Saved on this device <span class="saved-dot">●</span></span></footer></main><dialog id="editor"><form id="edit-form"><div class="dialog-top"><h2 id="dialog-title">Add an item</h2><button type="button" id="close-dialog" class="icon" aria-label="Close">×</button></div><label for="name">Name</label><input id="name" required maxlength="80" autocomplete="off" placeholder="e.g. Oat milk"><div class="dialog-actions"><button type="button" id="delete" class="danger" hidden>Delete</button><button type="submit" class="primary">Save</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
